name: Feature request
description: Suggest an idea for this project
title: "[Feature request]: "
labels:
  - "Enhancement ⬆️"
projects:
  # Community Hub Project
  - "torontojs/6"
body:
  - type: textarea
    attributes:
      label: Description
      description: Is your feature request related to a problem? Please describe. A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like. A clear and concise description of what you want to happen.
  - type: textarea
    attributes:
      label: Alternative solutions (if any)
      description: Describe alternatives you've considered. A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
