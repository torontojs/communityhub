name: Bug Report
description: Create a report to help us improve
title: "[BUG]: "
labels:
  - "Important ⚠️"
projects:
  # Community Hub Project
  - "torontojs/6"
body:
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Describe the steps to reproduce the error.
      required: true
      value: |
        1.
        2.
        3.
  - type: textarea
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      required: true
  - type: textarea
    attributes:
      label: Screenshots (if applicable)
      description: If applicable, add screenshots to help explain your problem.
  - type: input
    attributes:
      label: Operating System
      description: "The operating system you are running, e.g.: iOS, Windows 11, Ubuntu, etc."
      required: true
  - type: input
    attributes:
      label: Browsere.g. iOS, Windows 11, Ubuntu, etc.
      description: "The browser you are using, e.g.: Chrome, Safari, Firefox"
      required: true
  - type: input
    attributes:
      label: Browser Version
      description: "The browser version, if you know it."
      value: latest
  - type: textarea
    attributes:
      label: Additional Information
      description: Add any other context about the problem here.
