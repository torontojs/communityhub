name: "Close stale issues and PRs"
on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issue
          stale-issue-message: "This issue is stale because it has been open 160 days with no activity."
          days-before-issue-stale: 160
          days-before-issue-close: -1
          stale-issue-label: "Stale 🪨"
          close-issue-label: "Stale Closed 🔒"
          close-issue-reason: stale
          # PR
          stale-pr-message: "This PR is stale because there was no activity in the last 20 days. Remove the stale label or this PR will be closed in 30 days"
          days-before-pr-stale: 20
          days-before-pr-close: 30
          stale-pr-label: "Stale 🪨"
          close-pr-label: "Stale Closed 🔒"
