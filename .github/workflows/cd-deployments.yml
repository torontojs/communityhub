name: Cloudflare Worker Deployments

env:
  # Set the target environment variable for use in steps
  TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

on:
  push:
    branches:
      - main
      - dev
      - chore/deployment # For testing only, remove before merging with dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    env:
      NODE_VERSION: 22
      CLOUDFLARE_API_TOKEN: ${{ secrets.TJS_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TJS_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies and utilities
        run: |
          npm ci
          sudo apt-get update

      - name: Build project
        run: npm run build

      # - name: Manage D1 Database (Dev Only)
      #   if: ${{ env.TARGET_ENV == 'dev' }}
      #   run: |
      #     echo "Attempting to delete Dev database"
      #     npx wrangler d1 delete ${{ env.DEV_COMM_HUB_D1_DB_NAME }} -y || true > /dev/null

      # - name: Create New Dev D1 Instance (Dev Only)
      #   if: ${{ env.TARGET_ENV == 'dev' }}
      #   run: |
      #     npx wrangler d1 create ${{ env.DEV_COMM_HUB_D1_DB_NAME }} --env dev > /dev/null
      #     DB_ID=$(npx wrangler d1 info ${{ env.DEV_COMM_HUB_D1_DB_NAME }} --json | jq -r '.uuid')
      #     echo "DEV_COMM_HUB_D1_DB_ID=$DB_ID" >> $GITHUB_ENV

      - name: Reset Dev Database Tables
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: |
          echo "Fetching tables from Dev database..."
          # Note the % wildcards below – they are crucial!
          TABLES=$(npx wrangler d1 execute Database --env dev --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name NOT LIKE 'd1_%';" --json | jq -r '.[0].results[].name')

          if [ -z "$TABLES" ] || [ "$TABLES" == "null" ]; then
            echo "No tables found. Skipping drop."
          else
            DROP_COMMANDS="PRAGMA foreign_keys = OFF;"
            for table in $TABLES; do
              DROP_COMMANDS="$DROP_COMMANDS DROP TABLE IF EXISTS \"$table\";"
            done

            echo "Executing bulk drop with foreign_keys OFF..."
            npx wrangler d1 execute Database --env dev --remote --command "$DROP_COMMANDS"
          fi

      - name: Apply D1 Migrations to Database (Dev and Prod)
        run: npx wrangler d1 migrations apply Database --env ${{ env.TARGET_ENV }} --remote

      - name: Seed Data to DEV D1 Database (Dev Only)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler d1 execute Database --env dev --remote --file=./db/seeds/seed-data.sql

      # Deployment using Cloudflare Action (Dev and Prod)
      - name: Deploy Worker using cloudflare/wrangler-action@v3
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ env.TARGET_ENV }}
          workingDirectory: "./"

          # Pass secrets directly for the Worker's environment
          secrets: |
            RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ env.TARGET_ENV == 'production' && secrets.PROD_COMM_HUB_RESEND_API_KEY || secrets.DEV_COMM_HUB_RESEND_API_KEY}}
