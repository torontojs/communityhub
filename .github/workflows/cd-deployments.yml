name: Cloudflare Worker Deployments

env:
  # Set the target environment variable for use in steps
  TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    env:
      NODE_VERSION: 22
      CLOUDFLARE_API_TOKEN: ${{ secrets.TJS_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TJS_CLOUDFLARE_ACCOUNT_ID }}

      # Secrets/Vars that need to be substituted into wrangler.toml
      # DEV
      DEV_COMM_HUB_D1_DB_NAME: ${{ secrets.DEV_COMM_HUB_D1_DB_NAME }}
      DEV_COMM_HUB_SESSION_TOKENS_ID: ${{ secrets.DEV_COMM_HUB_SESSION_TOKENS_ID }}
      DEV_COMM_HUB_ACTIVATION_TOKENS_ID: ${{ secrets.DEV_COMM_HUB_ACTIVATION_TOKENS_ID }}
      DEV_COMM_HUB_PASSWORD_RESET_TOKENS_ID: ${{ secrets.DEV_COMM_HUB_PASSWORD_RESET_TOKENS_ID }}
      DEV_COMM_HUB_SENDER_EMAIL: ${{ secrets.DEV_COMM_HUB_SENDER_EMAIL }}

      # PROD
      PROD_COMM_HUB_D1_DB_NAME: ${{ secrets.PROD_COMM_HUB_D1_DB_NAME }}
      PROD_COMM_HUB_D1_DB_ID: ${{ secrets.PROD_COMM_HUB_D1_DB_ID }}
      PROD_COMM_HUB_SESSION_TOKENS_ID: ${{ secrets.PROD_COMM_HUB_SESSION_TOKENS_ID }}
      PROD_COMM_HUB_ACTIVATION_TOKENS_ID: ${{ secrets.PROD_COMM_HUB_ACTIVATION_TOKENS_ID }}
      PROD_COMM_HUB_PASSWORD_RESET_TOKENS_ID: ${{ secrets.PROD_COMM_HUB_PASSWORD_RESET_TOKENS_ID }}
      PROD_COMM_HUB_SENDER_EMAIL: ${{ secrets.PROD_COMM_HUB_SENDER_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies and utilities
        run: |
          npm ci
          sudo apt-get update
          # Install envsubst and jq to substitute secrets in wrangler.toml
          sudo apt-get install -y gettext-base jq

      - name: Build project
        run: npm run build

      - name: Manage D1 Database (Dev Only)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: |
          echo "Attempting to delete Dev database"
          npx wrangler d1 delete ${{ env.DEV_COMM_HUB_D1_DB_NAME }} -y || true > /dev/null

      - name: Create New Dev D1 Instance (Dev Only)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: |
          npx wrangler d1 create ${{ env.DEV_COMM_HUB_D1_DB_NAME }} --env dev > /dev/null
          DB_ID=$(npx wrangler d1 info ${{ env.DEV_COMM_HUB_D1_DB_NAME }} --json | jq -r '.uuid')
          echo "DEV_COMM_HUB_D1_DB_ID=$DB_ID" >> $GITHUB_ENV

      - name: Inject Bindings/Vars into Wrangler TOML using envsubst (Dev Only)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: |
          # The list of variables to substitute, matching the placeholders in wrangler.toml
          export ENV_VARS_TO_SUB="\$DEV_COMM_HUB_D1_DB_ID \$DEV_COMM_HUB_D1_DB_NAME \$DEV_COMM_HUB_SESSION_TOKENS_ID \$DEV_COMM_HUB_ACTIVATION_TOKENS_ID \$DEV_COMM_HUB_PASSWORD_RESET_TOKENS_ID \$DEV_COMM_HUB_SENDER_EMAIL"

          # Use envsubst to replace DEV placeholders in wrangler.toml, overwriting the file
          envsubst "$ENV_VARS_TO_SUB" < wrangler.toml > wrangler.toml.tmp
          mv wrangler.toml.tmp wrangler.toml

      - name: Apply D1 Migrations to DEV D1 Database (Dev Only)
        env:
          DEV_COMM_HUB_D1_DB_ID: ${{ env.DEV_COMM_HUB_D1_DB_ID }}
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler d1 migrations apply Database --env dev --remote

      - name: Seed Data to DEV D1 Database (Dev Only)
        env:
          DEV_COMM_HUB_D1_DB_ID: ${{ env.DEV_COMM_HUB_D1_DB_ID }}
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler d1 execute Database --env dev --remote --file=./db/seeds/seed-data.sql

      - name: Inject Bindings/Vars into Wrangler TOML using envsubst (Prod Only)
        if: ${{ env.TARGET_ENV == 'production' }}
        env:
          # Expose Prod D1 ID as a shell variable for envsubst
          PROD_COMM_HUB_D1_DB_ID: ${{ secrets.PROD_COMM_HUB_D1_DB_ID }}
        run: |
          # The list of variables to substitute, matching the placeholders in wrangler.toml
          export ENV_VARS_TO_SUB="\$PROD_COMM_HUB_D1_DB_ID \$PROD_COMM_HUB_D1_DB_NAME \$PROD_COMM_HUB_SESSION_TOKENS_ID \$PROD_COMM_HUB_ACTIVATION_TOKENS_ID \$PROD_COMM_HUB_PASSWORD_RESET_TOKENS_ID \$PROD_COMM_HUB_SENDER_EMAIL"

          # Use envsubst to replace PROD placeholders in wrangler.toml, overwriting the file
          envsubst "$ENV_VARS_TO_SUB" < wrangler.toml > wrangler.toml.tmp
          mv wrangler.toml.tmp wrangler.toml

      - name: Apply D1 Migrations to PROD D1 Database (Prod Only)
        env:
          PROD_COMM_HUB_D1_DB_ID: ${{ env.PROD_COMM_HUB_D1_DB_ID }}
        if: ${{ env.TARGET_ENV == 'production' }}
        run: npx wrangler d1 migrations apply Database --env production --remote

      # Deployment using Cloudflare Action (Dev and Prod)
      - name: Deploy Worker using cloudflare/wrangler-action@v3
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ env.TARGET_ENV }}
          workingDirectory: "./"

          # Pass secrets directly for the Worker's environment
          secrets: |
            RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ env.TARGET_ENV == 'production' && secrets.PROD_COMM_HUB_RESEND_API_KEY || secrets.DEV_COMM_HUB_RESEND_API_KEY}}
